<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Просмотр документа</title><link rel="stylesheet" href="/pdf-preview.css"><style>body{margin:16px;background:#f6f8f4;font-family:system-ui}.pdf-sheet{height:82vh}h1{font-size:18px}</style><header class="document-viewer-header"><a id="backToAssessment" class="document-viewer-back" href="/" target="_top">← К инструментам</a><h1>Документ клиента</h1></header><main id="viewer"></main><script type="module">import{mount}from'/pdf-preview.mjs';const p=new URLSearchParams(location.search);const deal=p.get('dealId'),doc=p.get('documentId');if(/^[1-9]\d*$/.test(deal||'')){const back=document.getElementById('backToAssessment');back.href='/assessment-review?dealId='+encodeURIComponent(deal);back.textContent='← К анкете';}if(/^[1-9]\d*$/.test(deal||'')&&/^[a-f0-9-]{36}$/i.test(doc||''))mount(document.getElementById('viewer'),{url:`/api/assessment/${deal}/documents/${doc}?view=pdf`,page:p.get('page')||1});else document.getElementById('viewer').textContent='Документ не найден.';</script></html>
