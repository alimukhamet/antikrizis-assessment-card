name: Apply reviewed file-selection controls
on:
  push:
    branches: [fix/four-tools-file-controls]
    paths: [.github/workflows/apply-file-controls.yml, .github/repairs/four-tools-1.json, .github/repairs/four-tools-2.json, .github/repairs/four-tools-3.json]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'alimukhamet/antikrizis-assessment-card'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Verify every original and resulting file before applying
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          hashes=['5d81e18c32f66d67de2536736930ee9d7b9fc3e54caa8ec38545f4e5118b7297','75201ff7028b09c469958b18cf5a1354206f2b72aa906f1d930943eadec9ffec','fc8eb35d8b98f6acb85554f37a57f2cd658567bfb91fd3609b63910a66d1f555']
          rows=[]
          for index,expected in enumerate(hashes,1):
              data=pathlib.Path(f'.github/repairs/four-tools-{index}.json').read_bytes()
              assert hashlib.sha256(data).hexdigest()==expected,'Manifest hash mismatch'
              rows.extend(json.loads(data))
          assert len(rows)==16 and len({r['path'] for r in rows})==16
          outputs=[]
          for row in rows:
              path=pathlib.Path(row['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert row['path'].startswith(('public/','templates/','tests/')) or row['path']=='.github/workflows/deploy-assessment.yml'
              if row['before'] is None:
                  assert not path.exists(),str(path)
                  old=''
              else:
                  raw=path.read_bytes()
                  assert hashlib.sha256(raw).hexdigest()==row['before'],str(path)+' changed since review'
                  old=raw.decode('utf-8')
              new=old
              previous=len(old)+1
              for start,end,text in reversed(row['edits']):
                  assert 0<=start<=end<=len(old) and end<previous
                  new=new[:start]+text+new[end:]
                  previous=start
              encoded=new.encode('utf-8')
              assert hashlib.sha256(encoded).hexdigest()==row['after'],str(path)+' output differs from tested source'
              outputs.append((path,encoded))
          for path,data in outputs:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          pathlib.Path('/tmp/file-controls-paths').write_text('\n'.join(str(path) for path,_ in outputs)+'\n')
          print('Verified and applied 16 exact reviewed file changes. Full PR CI is still required.')
          PY
      - name: Commit reviewed source, removing both temporary helpers
        run: |
          git diff --check
          while IFS= read -r path; do git add -- "$path"; done < /tmp/file-controls-paths
          git rm -- .github/workflows/file-controls-source.yml .github/workflows/apply-file-controls.yml .github/repairs/four-tools-1.json .github/repairs/four-tools-2.json .github/repairs/four-tools-3.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep four tools accessible and add non-destructive file remove and replace controls'
          git push origin HEAD:refs/heads/fix/four-tools-file-controls
