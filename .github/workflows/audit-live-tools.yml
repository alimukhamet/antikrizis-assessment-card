name: Read-only tools 03 and 04 audit
on:
  workflow_dispatch:
  push:
    branches: [fix/tool-rollout-audit]
    paths: ['scripts/audit-live-tools.mjs', '.github/workflows/audit-live-tools.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Inspect existing production cases without sending or changing client records
        env:
          ASSESSMENT_TEST_PASSWORD: ${{ secrets.ASSESSMENT_TEST_PASSWORD }}
        run: node scripts/audit-live-tools.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-tools-audit
          path: live-tools-audit.json
          retention-days: 1
