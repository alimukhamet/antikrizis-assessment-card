name: Tools 03 and 04 audit
on:
  workflow_dispatch:
    inputs:
      deal_id:
        description: 'Optional additional deal: read saved document diagnostics, with no draft or CRM writes'
        type: string
        default: ''
      refresh_saved_analysis:
        description: 'Refresh outdated analysis for saved deal 11749 originals; preserve answers and Bitrix'
        type: boolean
        default: false
      audit_lawyer_names:
        description: 'Read-only naming format audit only; exports matches without client names or titles'
        type: boolean
        default: false
      repair_title_deal_id:
        description: 'Explicit owner-authorized title repair for this exact delivered waiting deal; empty means no repair'
        type: string
        default: ''
      repair_title_expected_hash:
        description: 'Required immutable submission SHA-256 for the exact title repair target'
        type: string
        default: ''
      recover_request_id:
        description: 'Owner-authorized continuation of this exact existing submission; empty means read-only'
        type: string
        default: ''
      recover_expected_hash:
        description: 'Required immutable payload SHA-256 for that authorized recovery'
        type: string
        default: ''
  push:
    branches: [fix/tool-rollout-audit]
    paths: ['scripts/audit-live-tools.mjs', 'scripts/live-audit-result.mjs', '.github/workflows/audit-live-tools.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        if: inputs.audit_lawyer_names != true && inputs.repair_title_deal_id == ''
      - run: npx --no-install esbuild lib/documents/extract-native.ts --bundle --platform=node --format=esm --outfile=.audit-native-preview.mjs
        if: inputs.audit_lawyer_names != true && inputs.repair_title_deal_id == ''
      - run: npx --no-install esbuild lib/documents/gkb-balance-review.ts --bundle --platform=node --format=esm --outfile=.audit-gkb-preview.mjs
        if: inputs.audit_lawyer_names != true && inputs.repair_title_deal_id == ''
      - name: Inspect lawyer deal naming formats without exporting names
        if: inputs.audit_lawyer_names == true
        env:
          ASSESSMENT_TEST_PASSWORD: ${{ secrets.ASSESSMENT_TEST_PASSWORD }}
        run: node scripts/audit-lawyer-names.mjs
      - name: Repair the title of an explicitly selected delivered deal
        if: inputs.audit_lawyer_names != true && inputs.repair_title_deal_id != ''
        env:
          ASSESSMENT_TEST_PASSWORD: ${{ secrets.ASSESSMENT_TEST_PASSWORD }}
          REPAIR_TITLE_DEAL_ID: ${{ inputs.repair_title_deal_id }}
          REPAIR_TITLE_EXPECTED_HASH: ${{ inputs.repair_title_expected_hash }}
        run: node scripts/repair-lawyer-title.mjs
      - name: Recover an explicitly selected saved submission
        if: inputs.audit_lawyer_names != true && inputs.repair_title_deal_id == '' && inputs.recover_request_id != ''
        env:
          ASSESSMENT_TEST_PASSWORD: ${{ secrets.ASSESSMENT_TEST_PASSWORD }}
          AUDIT_DEAL_ID: ${{ inputs.deal_id }}
          RECOVER_REQUEST_ID: ${{ inputs.recover_request_id }}
          RECOVER_EXPECTED_HASH: ${{ inputs.recover_expected_hash }}
        run: node scripts/recover-assessment.mjs
      - name: Inspect existing cases and optionally refresh derived document analysis
        if: inputs.audit_lawyer_names != true && inputs.repair_title_deal_id == ''
        env:
          ASSESSMENT_TEST_PASSWORD: ${{ secrets.ASSESSMENT_TEST_PASSWORD }}
          REFRESH_SAVED_ANALYSIS: ${{ inputs.refresh_saved_analysis }}
          PREVIEW_NATIVE_ANALYSIS: '1'
          AUDIT_DEAL_ID: ${{ inputs.deal_id }}
        run: node scripts/audit-live-tools.mjs
      - uses: actions/upload-artifact@v4
        if: always() && inputs.audit_lawyer_names != true && inputs.repair_title_deal_id == ''
        with:
          name: live-tools-audit
          path: |
            live-tools-audit.json
            assessment-recovery.json
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always() && inputs.audit_lawyer_names == true
        with:
          name: lawyer-names-audit
          path: lawyer-names-audit.json
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always() && inputs.audit_lawyer_names != true && inputs.repair_title_deal_id != ''
        with:
          name: lawyer-title-repair
          path: lawyer-title-repair.json
          retention-days: 1
