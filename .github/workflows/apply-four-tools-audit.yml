name: Apply exact offline-audited file and credential repair
on:
  push:
    branches: [fix/four-tools-file-controls]
    paths: [.github/workflows/apply-four-tools-audit.yml, .github/repairs/four-tools-audit.patch.gz]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'alimukhamet/antikrizis-assessment-card'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Apply only the reviewed source bytes to the repair branch
        run: |
          python - <<'PY'
          import gzip,hashlib,pathlib,subprocess
          source=gzip.decompress(pathlib.Path('.github/repairs/four-tools-audit.patch.gz').read_bytes())
          assert hashlib.sha256(source).hexdigest()=='f6ebe39f2a55a548fea6cb790da9b45f1f9971f2a328df98a94734f65f1ce75c'
          patch=pathlib.Path('/tmp/four-tools-audit.patch');patch.write_bytes(source)
          subprocess.run(['git','apply','--unidiff-zero','--index','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--unidiff-zero','--index',str(patch)],check=True)
          expected={'public/assessment-workflow.js','public/credential-upload.js','public/file-selection-controls.js','public/server-drafts.js','tests/assessment-workflow.test.mjs','tests/client-drafts.test.mjs','tests/credential-browser-reliability.test.mjs','tests/document-upload-ui.test.mjs','tests/file-selection-controls.test.mjs'}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())
          assert changed==expected,(changed,expected)
          PY
          git diff --cached --stat
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix blocked file navigation, restored pending selections, and credential request races'
          git push origin HEAD:refs/heads/fix/four-tools-file-controls
