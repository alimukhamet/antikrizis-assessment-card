name: Profile source fill audit and guarded maintenance
on:
  workflow_dispatch:
    inputs:
      audit_only:
        type: boolean
        default: false
      apply:
        type: boolean
        default: false
      deal_ids:
        type: string
        default: ''
      pins:
        type: string
        default: '{}'
      guards:
        type: string
        default: '{}'
      expected_commit:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: profile-source-fill-maintenance
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref_type == 'branch' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin reviewed source
        env:
          EXPECTED: ${{ inputs.expected_commit }}
        run: test "$GITHUB_SHA" = "$EXPECTED"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install esbuild lib/questionnaire/draft.ts --bundle --platform=node --format=esm --outfile=.profile-fill-validation.mjs
      - name: Inspect or apply exact source-backed plans
        env:
          ASSESSMENT_TEST_PASSWORD: ${{ secrets.ASSESSMENT_TEST_PASSWORD }}
          PROFILE_FILL_AUDIT_ONLY: ${{ inputs.audit_only }}
          PROFILE_FILL_APPLY: ${{ inputs.apply }}
          PROFILE_FILL_IDS: ${{ inputs.deal_ids }}
          PROFILE_FILL_PINS: ${{ inputs.pins }}
          PROFILE_FILL_GUARDS: ${{ inputs.guards }}
        run: node scripts/audit-profile-source-fill.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-source-fill-audit
          path: profile-source-fill-audit.json
          retention-days: 3
