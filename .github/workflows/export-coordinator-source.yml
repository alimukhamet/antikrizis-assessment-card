name: Export coordinator baseline source
on:
  push:
    branches: [refactor/server-contract-coordinator]
    paths: [.github/workflows/export-coordinator-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive tracked source only, without git configuration or credentials
        run: git archive --format=tar.gz --output=/tmp/assessment-coordinator-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: assessment-coordinator-source
          path: /tmp/assessment-coordinator-source.tar.gz
          retention-days: 1
