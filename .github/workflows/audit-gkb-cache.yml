name: Guarded repair of old profile draft contract numbers
on:
  workflow_dispatch:
    inputs:
      deal_ids:
        description: 'Exact deal IDs, separated by commas (up to 50)'
        required: true
        type: string
      refresh_analysis:
        description: 'Update obsolete analysis only; preserve drafts, originals, reviews and CRM data'
        default: false
        type: boolean
      document_scope:
        description: 'Audit saved GKB reports, or all ordinary saved documents (no credentials)'
        default: 'gkb'
        type: choice
        options:
          - gkb
          - all
      verify_download_file_ids:
        description: 'Optional: verify bytes and timing of up to two existing Bitrix files in one case, without saving answers'
        default: ''
        type: string
      apply_draft_repair:
        description: 'Apply only exact previewed empty-contract-ID repairs; no profile completion or CRM writes'
        default: false
        type: boolean
      plan_pins:
        description: 'JSON object of exact preview plan hashes and single-use request UUIDs'
        default: '{}'
        type: string
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Verify guarded maintenance logic and actual draft schema
        run: |
          node --test tests/old-profile-contract-repair.test.mjs
          npx --no-install esbuild scripts/old-profile-validation-entry.mjs --bundle --platform=node --format=esm --external:cloudflare:workers --outfile=.old-profile-validation.mjs
      - name: Preview or apply exact draft repairs
        env:
          ASSESSMENT_TEST_PASSWORD: ${{ secrets.ASSESSMENT_TEST_PASSWORD }}
          REPAIR_DEAL_IDS: ${{ inputs.deal_ids }}
          APPLY_DRAFT_REPAIR: ${{ inputs.apply_draft_repair }}
          REPAIR_PLAN_PINS: ${{ inputs.plan_pins }}
        run: node scripts/repair-old-profile-drafts.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: old-profile-repair
          path: old-profile-repair.json
          retention-days: 3
