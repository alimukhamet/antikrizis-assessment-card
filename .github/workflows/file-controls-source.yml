name: File controls source snapshot
on:
  push:
    branches: [fix/four-tools-file-controls]
    paths: [.github/workflows/file-controls-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c05c32f74884e5b8b0e932331e8b6d3f4c3768b8
          persist-credentials: false
      - run: git archive --format=zip --output=/tmp/file-controls-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: file-controls-source
          path: /tmp/file-controls-source.zip
          retention-days: 1
