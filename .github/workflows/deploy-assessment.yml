name: Deploy assessment to Cloudflare

on:
  push:
    branches: [deploy/anti-krizis]
    paths-ignore:
      - 'SALES_TESTING.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assessment-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTIKRIZIS_EXTERNAL_DEPLOY: '1'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Require deployment and live verification credentials
        env:
          ASSESSMENT_TEST_PASSWORD: ${{ secrets.ASSESSMENT_TEST_PASSWORD }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Cloudflare deployment credentials are not configured in this repository.'
            echo 'Expected GitHub Actions secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.'
            exit 1
          fi
          if [ -z "$ASSESSMENT_TEST_PASSWORD" ]; then
            echo '::error::ASSESSMENT_TEST_PASSWORD is required for post-deployment verification.'
            exit 1
          fi

      - run: npm ci --no-audit --no-fund

      - name: Verify release source
        run: |
          npm run lint -- --max-warnings=0
          npx --no-install tsc --noEmit
          npm run build:anti-krizis
          npx --no-install wrangler deploy --dry-run --config wrangler.anti-krizis.jsonc --outdir /tmp/assessment-worker-dry-run

      - name: Require regression checks before production deployment
        run: |
          if node --test tests/*.test.mjs > /tmp/assessment-release-tests.log 2>&1; then
            tail -12 /tmp/assessment-release-tests.log
          else
            tail -100 /tmp/assessment-release-tests.log
            exit 1
          fi

      - name: Require runtime persistence and recovery checks
        run: npm run test:runtime

      - name: Deploy existing Worker configuration
        run: npx --no-install wrangler deploy --keep-vars --config wrangler.anti-krizis.jsonc

      - name: Verify live contract assets
        run: |
          set -euo pipefail
          origin='https://assessment.anti-krizis.kz'
          paths=(
            'tools-home.js'
            'app-ready.js'
            'client-context-ui.js'
            'client-workspace.js'
            'operations-config.js'
            'assessment-workflow.css'
            'contract-renderer.js'
            'submission-flow.js'
            'hosted-assessment.js'
            'server-drafts.js'
            'intake-data.js'
            'enforcement-editor.js'
            'document-review.js'
            'gkb-comparison.mjs'
            'gkb-comparison-ui.mjs'
            'server-answer-check.js'
            'money-input.js'
            'lawyer-handoff.js'
            'operations.js'
            'operations.css'
            'assessment-review.js'
            'assessment-workflow.js'
            'credential-upload.js'
            'document-replacement.js'
            'file-selection-controls.js'
            'legacy-file-controls.js'
            'file-selection-controls.css'
            'questionnaire.html'
            'vendor/contracts/pizzip-3.1.7.min.js'
            'vendor/contracts/docxtemplater-3.50.0.min.js'
          )
          for attempt in 1 2 3 4 5 6; do
            all_match=1
            for path in "${paths[@]}"; do
              expected="$(sha256sum "public/$path" | awk '{print $1}')"
              target="/tmp/${path//\//__}"
              status="$(curl --location --silent --show-error --max-time 20 \
                --user-agent 'Mozilla/5.0 (compatible; AntiKrizisReleaseCheck/1.0)' \
                --header 'Cache-Control: no-cache' \
                --output "$target" --write-out '%{http_code}' "$origin/$path" || true)"
              if [ "$status" != '200' ] || [ ! -s "$target" ]; then
                echo "$path HTTP=$status"
                all_match=0
                continue
              fi
              actual="$(sha256sum "$target" | awk '{print $1}')"
              if [ "$actual" != "$expected" ]; then
                echo "$path hash mismatch"
                all_match=0
              else
                echo "$path verified"
              fi
            done
            if [ "$all_match" = '1' ]; then
              echo 'All release assets are live and verified.'
              exit 0
            fi
            if [ "$attempt" != '6' ]; then sleep 10; fi
          done
          echo '::error::Deployment command completed, but live release assets did not converge to this commit.'
          exit 1

      - name: Verify authenticated production read paths
        env:
          ASSESSMENT_TEST_PASSWORD: ${{ secrets.ASSESSMENT_TEST_PASSWORD }}
        run: node scripts/audit-live-tools.mjs

      - name: Preserve live audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-live-tools-audit
          path: live-tools-audit.json
          if-no-files-found: ignore
          retention-days: 1
