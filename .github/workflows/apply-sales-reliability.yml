name: Verify and apply sales reliability repair
on:
  push:
    branches: [fix/contract-download-reliability]
    paths: [.github/workflows/apply-sales-reliability.yml, .github/repairs/sales-fixes.patch]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'alimukhamet/antikrizis-assessment-card'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTIKRIZIS_EXTERNAL_DEPLOY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply only the reviewed patch
        run: |
          git apply --unidiff-zero --check .github/repairs/sales-fixes.patch
          git apply --unidiff-zero .github/repairs/sales-fixes.patch
          git diff --name-only > /tmp/repair-paths
          git diff --exit-code -- templates/assessment-card.html package.json package-lock.json
      - name: Install and copy pinned unmodified contract distributions
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix /tmp/contract-libs --ignore-scripts --no-package-lock --no-audit --no-fund pizzip@3.1.7 docxtemplater@3.50.0
          mkdir -p public/vendor/contracts
          cp /tmp/contract-libs/node_modules/pizzip/dist/pizzip.min.js public/vendor/contracts/pizzip-3.1.7.min.js
          cp /tmp/contract-libs/node_modules/docxtemplater/build/docxtemplater.min.js public/vendor/contracts/docxtemplater-3.50.0.min.js
          cp /tmp/contract-libs/node_modules/pizzip/LICENSE.markdown public/vendor/contracts/pizzip-LICENSE.markdown
          cp /tmp/contract-libs/node_modules/docxtemplater/LICENSE.md public/vendor/contracts/docxtemplater-LICENSE.md
          echo 'f1c851bff85c23f20555cfe18f6242dfd8c6117121050ad8bb53919230d2f571  public/vendor/contracts/pizzip-3.1.7.min.js' | sha256sum --check
          echo 'b744ba75b698403ccd1b9e7abe8065354619893cc2fe0683801395766ba79906  public/vendor/contracts/docxtemplater-3.50.0.min.js' | sha256sum --check
      - name: Regenerate and verify the exact locally tested renderer
        run: |
          node scripts/build-contract-renderer.mjs
          echo '204e94a73e85d2645bd41354b47fc2f72ab93088026128b669bb1c35e353fb79  public/contract-renderer.js' | sha256sum --check
          echo '90fb429e9e778caa8d0e7bce307da8795d43da18c580c5c3f08a154b378d48f0  public/contract-words.mjs' | sha256sum --check
          echo '94ad37e6beec3db2932124b3f1d9af759f487269de7bfa4ef6e24d31f554a800  tests/runtime-reliability.test.mjs' | sha256sum --check
      - name: Lint with zero warnings
        run: npm run lint -- --max-warnings=0
      - name: Type check
        run: npx --no-install tsc --noEmit
      - name: Full application build and regression suite
        run: npm test
      - name: Commit only the verified source and generated contract files
        run: |
          git diff --exit-code -- templates/assessment-card.html package.json package-lock.json
          while IFS= read -r path; do git add -- "$path"; done < /tmp/repair-paths
          git add -- public/contract-renderer.js public/contract-words.mjs public/contract-renderers public/vendor/contracts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden sales testing: local contract libraries, session recovery, draft races, and typed handoff guards'
          git push origin HEAD:refs/heads/fix/contract-download-reliability
