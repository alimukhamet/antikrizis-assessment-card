name: Refresh contract assets once
on:
  push:
    branches: [fix/contract-download-reliability]
    paths: [.github/workflows/refresh-contract-assets.yml]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'alimukhamet/antikrizis-assessment-card'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Generate and verify only the prepared contract assets
        run: |
          node scripts/build-contract-renderer.mjs
          test "$(git hash-object public/contract-renderer.js)" = 77cd0cdccb8bfc9605c18a7cf66cb0c39db56378
          test "$(git hash-object public/contract-words.mjs)" = d2ef26099824d9ea665282c016cf5bea5af7b244
          test "$(git hash-object public/contract-renderers/58c760e9322067e6583b3c72b57f107305fba5efa0b69e4bb1742e53e7e3e8da.js)" = 77cd0cdccb8bfc9605c18a7cf66cb0c39db56378
          git diff --exit-code -- templates/assessment-card.html
          node --test tests/contract-libraries.test.mjs tests/payment-schedule.test.mjs tests/document-package.test.mjs
      - name: Commit only generated assets to the repair branch
        run: |
          git add -- public/contract-renderer.js public/contract-words.mjs public/contract-renderers/58c760e9322067e6583b3c72b57f107305fba5efa0b69e4bb1742e53e7e3e8da.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate verified contract download assets'
          git push origin HEAD:refs/heads/fix/contract-download-reliability
