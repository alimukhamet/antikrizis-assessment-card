name: Read-only live assessment diagnosis
on:
  push:
    branches: [diagnose/live-assessment-readonly]
    paths: [.github/workflows/live-assessment-readonly.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pending state and test configured staff login
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_ACCESS_PASSWORD: ${{ secrets.SITE_ACCESS_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const out={productionWrites:0,staffPasswordConfigured:Boolean(process.env.SITE_ACCESS_PASSWORD),database:null,staffLogin:null};
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(token&&account){
            const sql="SELECT c.external_id AS deal_id,s.request_id,s.actor_id,s.state,s.outcome_code,s.history_state,s.history_outcome_code,s.updated_at FROM assessment_submissions s JOIN assessment_cases c ON c.id=s.case_id WHERE c.external_id IN ('10479','11877','11749') ORDER BY s.created_at DESC LIMIT 12";
            try{const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/52579528-2df1-42ca-9ec7-526893d7727f/query`,{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify({sql}),signal:AbortSignal.timeout(20000)});const j=await r.json();out.database={http:r.status,success:j.success,codes:j.errors?.map(e=>e.code),results:j.success?j.result?.map(r=>r.results):undefined};}catch(e){out.database={error:e.name};}
          }
          if(process.env.SITE_ACCESS_PASSWORD){
            const origin='https://assessment.anti-krizis.kz';
            try{const r=await fetch(origin+'/api/session',{method:'POST',headers:{'content-type':'application/json',origin},body:JSON.stringify({worker:'ali',password:process.env.SITE_ACCESS_PASSWORD}),redirect:'manual',signal:AbortSignal.timeout(20000)});out.staffLogin={http:r.status};}catch(e){out.staffLogin={error:e.name};}
          }
          fs.mkdirSync('/tmp/live-audit',{recursive:true});fs.writeFileSync('/tmp/live-audit/access-status.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));
          NODE
      - name: Export exact source only
        run: |
          git archive --format=zip HEAD > /tmp/live-audit/source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: live-assessment-readonly
          path: /tmp/live-audit/
          retention-days: 1
