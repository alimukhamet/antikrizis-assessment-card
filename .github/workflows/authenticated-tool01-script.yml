name: Authenticated Tool 01 acceptance script
on:
  push:
    branches: [diagnose/authenticated-acceptance-11665]
    paths:
      - tests/browser/production-tool01-acceptance.py
      - .github/workflows/authenticated-tool01-script.yml
permissions:
  contents: read
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ORIGIN: https://assessment.anti-krizis.kz
      ASSESSMENT_TEST_PASSWORD: ${{ secrets.ASSESSMENT_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check --quiet playwright==1.55.0
      - run: python tests/browser/production-tool01-acceptance.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool01-production-acceptance-redacted
          path: /tmp/tool01-production.json
          retention-days: 1
          if-no-files-found: ignore
