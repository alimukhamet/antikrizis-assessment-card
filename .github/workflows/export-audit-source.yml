name: Export pinned audit source
on:
  push:
    branches: [diagnose/four-tools-audit-source]
    paths: [.github/workflows/export-audit-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2f07cc393ea1c93fa97bfaae01b74a1db394a39d
          persist-credentials: false
      - run: |
          mkdir -p /tmp/audit-source
          git archive --format=zip HEAD > /tmp/audit-source/source.zip
          git rev-parse HEAD > /tmp/audit-source/commit.txt
          git rev-parse HEAD^{tree} > /tmp/audit-source/tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: four-tools-audit-source
          path: /tmp/audit-source/
          retention-days: 1
