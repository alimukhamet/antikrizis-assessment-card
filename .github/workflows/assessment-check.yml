name: Assessment checks
on:
  pull_request:
    branches: [main, deploy/anti-krizis]
  push:
    branches: [main, deploy/anti-krizis]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Lint with zero warnings
        run: npm run lint -- --max-warnings=0
      - name: Type check
        if: always()
        run: npx --no-install tsc --noEmit
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTIKRIZIS_EXTERNAL_DEPLOY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Build the application
        run: npm run build
      - name: Validate Cloudflare package without deploying
        run: npx --no-install wrangler deploy --dry-run --config wrangler.anti-krizis.jsonc --outdir /tmp/assessment-worker-dry-run
      - name: Run the complete Node test suite
        run: |
          if node --test tests/*.test.mjs > /tmp/assessment-tests.log 2>&1; then
            tail -12 /tmp/assessment-tests.log
          else
            grep -A30 '^not ok' /tmp/assessment-tests.log || true
            tail -12 /tmp/assessment-tests.log
            exit 1
          fi
      - name: Type check
        run: npx --no-install tsc --noEmit
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assessment-test-log
          path: /tmp/assessment-tests.log
          if-no-files-found: ignore
          retention-days: 7
  publication:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/deploy/anti-krizis')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compare live public release assets with this release
        run: |
          set -euo pipefail
          origin='https://assessment.anti-krizis.kz'
          paths=(
            'contract-renderer.js'
            'submission-flow.js'
            'hosted-assessment.js'
            'server-drafts.js'
            'vendor/contracts/pizzip-3.1.7.min.js'
            'vendor/contracts/docxtemplater-3.50.0.min.js'
          )
          mkdir -p /tmp/live-assets
          : > /tmp/publication.tsv
          matched=0
          for attempt in 1 2 3 4 5 6 7 8; do
            : > /tmp/publication.tsv
            all_match=1
            echo "Release verification attempt ${attempt}"
            for path in "${paths[@]}"; do
              expected="$(sha256sum "public/$path" | awk '{print $1}')"
              target="/tmp/live-assets/${path//\//__}"
              status="$(curl --location --silent --show-error --max-time 20 \
                --user-agent 'Mozilla/5.0 (compatible; AntiKrizisReleaseCheck/1.0)' \
                --header 'Cache-Control: no-cache' \
                --output "$target" --write-out '%{http_code}' "$origin/$path" || true)"
              if [ "$status" = '200' ] && [ -s "$target" ]; then
                actual="$(sha256sum "$target" | awk '{print $1}')"
              else
                actual='unavailable'
              fi
              same=false
              if [ "$status" = '200' ] && [ "$actual" = "$expected" ]; then
                same=true
              else
                all_match=0
              fi
              printf '%s\t%s\t%s\t%s\t%s\n' "$path" "$status" "$expected" "$actual" "$same" >> /tmp/publication.tsv
              echo "$path HTTP=$status match=$same"
            done
            if [ "$all_match" = '1' ]; then
              matched=1
              break
            fi
            if [ "$attempt" != '8' ]; then sleep 15; fi
          done
          python - <<'PY'
          import json, os, pathlib
          rows=[]
          for line in pathlib.Path('/tmp/publication.tsv').read_text().splitlines():
              path,status,expected,actual,matches=line.split('\t')
              rows.append({'path':path,'status':int(status) if status.isdigit() else status,'expected':expected,'actual':actual,'matches':matches=='true'})
          report={'commit':os.environ['GITHUB_SHA'],'origin':'https://assessment.anti-krizis.kz','scope':'public_assets_only','assets':rows,'matchesReleaseAssets':all(r['matches'] for r in rows)}
          pathlib.Path('publication-check.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('## Read-only publication check\n\n')
              summary.write('All checked public assets match this release. This is not an authenticated end-to-end test.\n' if report['matchesReleaseAssets'] else 'Live public assets do not yet all match this release. No deployment was performed by this check.\n')
          PY
          test "$matched" = '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-check
          path: publication-check.json
          if-no-files-found: ignore
          retention-days: 7
