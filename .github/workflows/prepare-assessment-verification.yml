name: Prepare assessment verification
on:
  push:
    branches: [fix/contract-download-reliability]
    paths: [.github/workflows/prepare-assessment-verification.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Retrieve exact published packages without install scripts
        run: |
          mkdir -p /tmp/assessment-verification/vendor /tmp/assessment-tools
          npm install --prefix /tmp/assessment-tools --ignore-scripts --no-package-lock --no-audit --no-fund jsdom@30.0.1 typescript@5.9.3 fake-indexeddb@6.2.5 pizzip@3.1.7 docxtemplater@3.50.0
          cp /tmp/assessment-tools/node_modules/pizzip/dist/pizzip.min.js /tmp/assessment-verification/vendor/pizzip-3.1.7.min.js
          cp /tmp/assessment-tools/node_modules/docxtemplater/build/docxtemplater.min.js /tmp/assessment-verification/vendor/docxtemplater-3.50.0.min.js
          find /tmp/assessment-tools/node_modules/pizzip /tmp/assessment-tools/node_modules/docxtemplater -maxdepth 1 -iname '*license*' -print -exec cp --parents {} /tmp/assessment-verification/ \;
          cd /tmp/assessment-verification
          sha256sum vendor/*.js > SHA256SUMS
          cat SHA256SUMS
          tar -czf test-tools.tar.gz -C /tmp/assessment-tools node_modules
      - name: Check publication and deployment configuration without changing production
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then echo 'DEPLOYMENT_CREDENTIALS_PRESENT=yes'; else echo 'DEPLOYMENT_CREDENTIALS_PRESENT=no'; fi
          for path in /login /contract-renderer.js; do
            curl --silent --show-error --max-time 20 --output /dev/null --write-out "$path HTTP=%{http_code} content=%{content_type}\n" "https://assessment.anti-krizis.kz$path" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: assessment-verification-tools
          path: /tmp/assessment-verification
          retention-days: 1
