name: Verify server contract coordinator
on:
  push:
    branches: [refactor/server-contract-operation]
    paths: [.github/workflows/temporary-source-snapshot.yml, .github/repairs/coordinator-1.b64, .github/repairs/coordinator-2.b64, .github/repairs/coordinator-3.b64]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'alimukhamet/antikrizis-assessment-card'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTIKRIZIS_EXTERNAL_DEPLOY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Reconstruct and verify the exact locally tested patch
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,pathlib
          text=''.join(pathlib.Path(f'.github/repairs/coordinator-{i}.b64').read_text().strip() for i in range(1,4))
          # Correct a known transcription error in transport; the complete SHA below is authoritative.
          text=text.replace('br1voWiBi0C2+XRqkRgkGxDHs','br1voWiIB0C2+XRqkRgkGxDHs')
          patch=gzip.decompress(base64.b64decode(text,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='ba8e7e412dcb2ae5b2a613f42988e53394a7efb25cc52f9892f228bc5a00386f','Patch digest mismatch'
          pathlib.Path('/tmp/coordinator.patch').write_bytes(patch)
          PY
          git apply --index --check /tmp/coordinator.patch
          git apply --index /tmp/coordinator.patch
          test "$(git hash-object tests/review-to-download.test.mjs)" = '3ab05cb8ac7363f5db53acda149acdd0b39cd250'
          git diff --cached --stat
      - run: npm ci --no-audit --no-fund
      - name: Zero-warning lint
        run: npm run lint -- --max-warnings=0
      - name: Type check
        run: npx --no-install tsc --noEmit
      - name: Focused coordinator and document-review regressions
        run: node --test tests/review-to-download.test.mjs tests/contract-operation-route.test.mjs tests/submission-engine-regression.test.mjs tests/submission-flow.test.mjs tests/submission-main-button.test.mjs tests/submission-auto-reconcile.test.mjs
      - name: Full build and regression suite
        run: |
          if npm test > /tmp/assessment-tests.log 2>&1; then
            tail -12 /tmp/assessment-tests.log
          else
            grep -A30 '^not ok' /tmp/assessment-tests.log || true
            tail -30 /tmp/assessment-tests.log
            exit 1
          fi
      - name: Verify Cloudflare packaging without deployment
        run: npx --no-install wrangler deploy --dry-run --config wrangler.anti-krizis.jsonc --outdir /tmp/assessment-worker-dry-run
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coordinator-verification
          path: |
            /tmp/assessment-tests.log
            /tmp/coordinator.patch
            .github/repairs/coordinator-*.b64
          if-no-files-found: ignore
          retention-days: 1
      - name: Commit only verified source and remove temporary transport
        run: |
          git diff --exit-code
          git rm -- .github/workflows/temporary-source-snapshot.yml .github/repairs/coordinator-1.b64 .github/repairs/coordinator-2.b64 .github/repairs/coordinator-3.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Move contract completion to one guarded server continuation'
          git push origin HEAD:refs/heads/refactor/server-contract-operation
