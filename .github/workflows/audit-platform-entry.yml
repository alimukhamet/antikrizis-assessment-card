name: Verify sales Platform entry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify the three approved sales entries without changing client records
        env:
          ASSESSMENT_TEST_PASSWORD: ${{ secrets.ASSESSMENT_TEST_PASSWORD }}
        run: node scripts/audit-live-platform-entry.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-entry-verification
          path: live-platform-entry-audit.json
          if-no-files-found: error
          retention-days: 7
