name: Profile and contract cohort audit
on:
  push:
    branches: [fix/profile-contract-workflow-audit]
    paths: [.github/workflows/audit-workflow-cohort.yml]
  workflow_dispatch:
    inputs:
      case_ids:
        description: 'Additional saved deal IDs, comma separated; all current profile queue entries are always checked'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: workflow-cohort-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node scripts/audit-workflow-cohort.mjs
        env:
          ASSESSMENT_TEST_PASSWORD: ${{ secrets.ASSESSMENT_TEST_PASSWORD }}
          AUDIT_CASE_IDS: ${{ inputs.case_ids }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-cohort-audit
          path: workflow-cohort-audit.json
          retention-days: 3
